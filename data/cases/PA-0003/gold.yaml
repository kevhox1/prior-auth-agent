        quote: "Weight 92.4 kg."
      - doc_id: PT-0003/gi-note-2026-10-28
        quote: "520 mg IV once (weight 92.4 kg), then 90 mg subcutaneously every 8 weeks starting 8 weeks after the IV dose."
