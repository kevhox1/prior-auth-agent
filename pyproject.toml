[project]
name = "prior-auth-agent"
version = "0.1.0"
description = "Prior authorization agent for IBD biologics (synthetic data, not clinically validated)"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "evals*", "ui*"]
