# Reviewer UI theme (matches ui/styles.css). Streamlit reads this when run from the repo root.
[theme]
base = "light"
primaryColor = "#2F5BFF"
backgroundColor = "#F5F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1629"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
